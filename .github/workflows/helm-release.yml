name: Release - Helm Charts

on:
  push:
    paths:
      - 'charts/**'
    branches:
      - main
  workflow_dispatch:
    
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@fe7b31a282fb0ca3152f275973344055f10692fe # v4.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@a3454e4ca022be087437207f2d790586e92cfb4a # v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"