---

name: Public release bpn-discovery
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

env:
  IMAGE_NAMESPACE: tractusx
  IMAGE_NAME: sldt-bpn-discovery

jobs:
  build-image:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout if push
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout if workflow_dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - name: setup-java
        uses: actions/setup-java@3a4f6111f18e3a0147563e7784f39100145c11a0 # v4.5.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@0e2815143a6ed59556a3e5c9a4195155c8291a27 # v1.18.0
        with:
          java-version: 17
      - name: execute-maven-deps
        working-directory: ./backend
        run: mvn verify dependency:list -DskipTests -Dmaven.javadoc.skip=true -DappendOutput=false -DoutputFile=maven.deps -DincludeScope=compile
      - name: install dependencies
        working-directory: ./.github/actions/generate-dependencies-notice
        run: npm install
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@369ebfd91f94d18ba5518205ef5520a79053073e # v5.6.1
        with:
          images: |
            ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
      - name: DockerHub login
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a62 # v6.13.0
        with:
          context: .
          push: true
          file: ./backend/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@e98e4cdccd44da2338bc99532ade606999059537 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKER_NOTICE.md